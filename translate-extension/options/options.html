<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>划词翻译 - 设置</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #181825;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --accent: #89b4fa;
      --border: #313244;
      --danger: #f38ba8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      min-width: 320px;
    }
    h2 { font-size: 18px; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: var(--subtext); margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: var(--subtext); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: var(--bg);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .toast {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .toast.success { display: block; background: #1a4d2e; color: #a6e3a1; }
    .toast.error { display: block; background: #4d1a2e; color: var(--danger); }
    .hint {
      margin-top: 16px;
      font-size: 11px;
      color: var(--subtext);
      line-height: 1.5;
    }
    .hint a { color: var(--accent); }
  </style>
</head>
<body>
  <h2>划词翻译 - 设置</h2>
  <p class="subtitle">配置 DeepSeek API Key</p>

  <label for="apiKey">API Key</label>
  <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">

  <button id="saveBtn">保存</button>
  <div id="toast" class="toast"></div>

  <p class="hint">
    前往 <a href="https://platform.deepseek.com/api_keys" target="_blank">platform.deepseek.com</a> 创建 API Key
  </p>

  <script src="options.js"></script>
</body>
</html>
